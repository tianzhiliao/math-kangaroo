[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kangaroo-pdf-json"
version = "0.1.0"
description = "PNG release dataset packager for Math Kangaroo frontends."
requires-python = ">=3.11"
dependencies = [
  "Pillow>=10.0.0",
  "pdfplumber>=0.11.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
