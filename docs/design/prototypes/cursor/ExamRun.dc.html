<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Exam in progress</title>
<script src="../support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400&amp;family=JetBrains+Mono:wght@400&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="min-height: 900px; background: #f7f7f4; color: #26251e; font-family: 'Inter', system-ui, sans-serif; font-weight: 400; display: flex; flex-direction: column;">
  <header style="position: relative; box-shadow: inset 0 -1px 0 rgba(38,37,30,0.1);">
    <div style="min-height: 64px; padding: 8px 20px; box-sizing: border-box; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px;">
      <div style="display: flex; align-items: center; gap: 10px; font-size: 15px;">
        <a href="Home.dc.html" style="font-size: 17px; color: #26251e; text-decoration: none;">Math Kangaroo</a>
        <span style="color: rgba(38,37,30,0.4);">/</span>
        <span>Level P · Brazil 2020</span>
      </div>
      <div style="display: flex; align-items: baseline; gap: 8px;" aria-live="polite">
        <span style="font-size: 13px; letter-spacing: 0.01em; color: rgba(38,37,30,0.6);">Time left</span>
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 22px;">31:24</span>
      </div>
      <div style="display: flex; gap: 8px;">
        <a href="ExamPicker.dc.html" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 18px; border-radius: 9999px; box-shadow: inset 0 0 0 1px rgba(38,37,30,0.2); color: #26251e; font-size: 15px; text-decoration: none;">Leave</a>
        <button type="button" style="min-height: 44px; padding: 0 20px; border: none; border-radius: 9999px; background: #26251e; color: #f7f7f4; font: inherit; font-size: 15px;">Submit exam</button>
      </div>
    </div>
    <div role="progressbar" aria-label="Exam time remaining" aria-valuemin="0" aria-valuemax="100" aria-valuenow="70" style="position: absolute; left: 0; right: 0; bottom: 0; height: 2px;"><div style="width: 70%; height: 2px; background: #26251e;"></div></div>
  </header>

  <div style="flex: 1; display: flex; flex-wrap: wrap;">
    <aside style="flex: 1 1 240px; max-width: 100%; box-sizing: border-box; background: #f2f1ed; padding: 22px 20px; display: flex; flex-direction: column; gap: 16px;">
      <div style="display: flex; justify-content: space-between; align-items: baseline;">
        <h2 style="margin: 0; font-size: 14px; font-weight: 400; letter-spacing: 0.01em; color: rgba(38,37,30,0.6);">Questions</h2>
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; color: rgba(38,37,30,0.6);">5 / 24 answered</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px;">
        <sc-for list="{{chips}}" as="c" hint-placeholder-count="24">
          <button type="button" aria-label="{{c.aria}}" style="{{c.style}}">{{c.n}}</button>
        </sc-for>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: rgba(38,37,30,0.6);">
        <span style="display: flex; align-items: center; gap: 8px;"><span style="width: 12px; height: 12px; border-radius: 2px; box-shadow: 0 0 0 1px #f2f1ed, 0 0 0 2px #f54e00;"></span>Now</span>
        <span style="display: flex; align-items: center; gap: 8px;"><span style="width: 12px; height: 12px; border-radius: 2px; background: #26251e;"></span>Answered</span>
        <span style="display: flex; align-items: center; gap: 8px;"><span style="width: 12px; height: 12px; border-radius: 2px; box-shadow: inset 0 0 0 1px rgba(38,37,30,0.2);"></span>Not answered</span>
      </div>
    </aside>

    <main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column;">
      <div style="flex: 1; padding: 32px 40px; display: flex; justify-content: center;">
        <article style="width: 100%; max-width: 880px; display: flex; flex-direction: column; gap: 26px;">
          <div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start;">
            <div style="flex: 1 1 360px; min-width: 0; display: flex; flex-direction: column; gap: 12px;">
              <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px;">
                <p style="margin: 0; font-family: 'JetBrains Mono', monospace; font-size: 13px; color: rgba(38,37,30,0.6);">Q2 · 3 pts</p>
                <button type="button" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border: none; border-radius: 9999px; background: transparent; box-shadow: inset 0 0 0 1px rgba(38,37,30,0.2); color: #26251e; font: inherit; font-size: 15px;">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18 6a8 8 0 0 1 0 12"/></svg>Listen
                </button>
              </div>
              <p style="margin: 0; font-size: 26px; line-height: 1.3; letter-spacing: -0.0125em;">Julia has 5 pieces of plastic and has stacked these pieces on a table, as shown beside. What was the second piece she put on the table?</p>
            </div>
            <figure style="margin: 0; flex: 0 0 auto; background: #ffffff; border-radius: 4px; padding: 12px; box-shadow: inset 0 0 0 1px rgba(38,37,30,0.1);">
              <img src="../assets/stack.svg" alt="Five stacked plastic pieces" style="display: block; width: 168px; height: 200px; object-fit: contain;">
            </figure>
          </div>

          <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12.8px;">
            <sc-for list="{{choices}}" as="o" hint-placeholder-count="5">
              <button type="button" aria-pressed="{{o.pressed}}" style="{{o.card}}">
                <span style="{{o.badge}}">{{o.label}}</span>
                <img src="{{o.src}}" alt="{{o.alt}}" style="display: block; width: 100%; height: 104px; object-fit: contain; background: #ffffff; border-radius: 2px;">
              </button>
            </sc-for>
          </div>
        </article>
      </div>

      <footer style="box-shadow: inset 0 1px 0 rgba(38,37,30,0.1); padding: 14px 40px;">
        <div style="max-width: 880px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between;">
          <button type="button" style="min-height: 52px; min-width: 140px; padding: 0 26px; border: none; border-radius: 9999px; background: transparent; box-shadow: inset 0 0 0 1px rgba(38,37,30,0.2); color: #26251e; font: inherit; font-size: 16px;">← Previous</button>
          <span style="font-family: 'JetBrains Mono', monospace; font-size: 14px; color: rgba(38,37,30,0.6);">2 / 24</span>
          <button type="button" style="min-height: 52px; min-width: 140px; padding: 0 26px; border: none; border-radius: 9999px; background: #26251e; color: #f7f7f4; font: inherit; font-size: 16px;">Next →</button>
        </div>
      </footer>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const answered = { 1: 1, 2: 1, 3: 1, 4: 1, 5: 1 };
    const base = 'height: 46px; border: none; border-radius: 4px; font-family: "JetBrains Mono", monospace; font-size: 15px; box-sizing: border-box;';
    const chips = [];
    for (let n = 1; n <= 24; n++) {
      let s = answered[n] ? 'background: #26251e; color: #f7f7f4;' : 'background: transparent; color: rgba(38,37,30,0.6); box-shadow: inset 0 0 0 1px rgba(38,37,30,0.2);';
      if (n === 2) s = 'background: #26251e; color: #f7f7f4; box-shadow: 0 0 0 2px #f2f1ed, 0 0 0 4px #f54e00;';
      chips.push({ n, aria: 'Question ' + n, style: base + s });
    }
    const imgs = {
      A: '../assets/choice-a.svg', B: '../assets/choice-b.svg',
      C: '../assets/choice-c.svg', D: '../assets/choice-d.svg',
      E: '../assets/choice-e.svg'
    };
    const choices = ['A', 'B', 'C', 'D', 'E'].map((l) => {
      const sel = l === 'B';
      return {
        label: l, src: imgs[l], alt: 'Option ' + l, pressed: sel ? 'true' : 'false',
        card: 'display: flex; flex-direction: column; align-items: flex-start; gap: 10px; padding: 10px; border: none; border-radius: 4px; cursor: pointer; text-align: left; font: inherit; ' +
          (sel ? 'background: #e6e5e0; box-shadow: inset 0 0 0 2px #26251e;' : 'background: #f2f1ed; box-shadow: inset 0 0 0 1px rgba(38,37,30,0.1);'),
        badge: 'width: 40px; height: 40px; border-radius: 9999px; display: flex; align-items: center; justify-content: center; font-size: 17px; box-sizing: border-box; ' +
          (sel ? 'background: #26251e; color: #f7f7f4;' : 'color: #26251e; box-shadow: inset 0 0 0 1px rgba(38,37,30,0.6);')
      };
    });
    return { chips, choices };
  }
}
</script>
</body>
</html>
