<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Practice on phone</title>
<script src="../support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400&amp;family=JetBrains+Mono:wght@400&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #f7f7f4; color: #26251e; font-family: 'Inter', system-ui, sans-serif; font-weight: 400;">
  <header style="position: relative; height: 52px; padding: 0 8px 0 4px; display: flex; align-items: center; justify-content: space-between; box-shadow: inset 0 -1px 0 rgba(38,37,30,0.1);">
    <a href="Home.dc.html" aria-label="Home" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: #26251e; text-decoration: none; font-size: 20px;">←</a>
    <span style="font-family: 'JetBrains Mono', monospace; font-size: 14px;">Q78 / 270</span>
    <a href="PracticeExit.dc.html" style="min-height: 40px; padding: 0 14px; display: flex; align-items: center; border-radius: 9999px; box-shadow: inset 0 0 0 1px rgba(38,37,30,0.2); color: #26251e; font-size: 14px; text-decoration: none;">End</a>
    <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 2px;"><div style="width: 29%; height: 2px; background: #f54e00;"></div></div>
  </header>

  <div style="background: #f2f1ed; padding: 10px 14px; display: flex; gap: 6px; overflow: hidden;">
    <sc-for list="{{chips}}" as="c" hint-placeholder-count="8">
      <button type="button" aria-label="{{c.aria}}" style="{{c.style}}">{{c.n}}</button>
    </sc-for>
  </div>

  <main style="padding: 18px 16px 140px; display: flex; flex-direction: column; gap: 14px;">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px;">
      <p style="margin: 0; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: rgba(38,37,30,0.6);">Felix · Austria 2019 · #3 · 3 pts</p>
      <button type="button" style="display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 14px; border: none; border-radius: 9999px; background: transparent; box-shadow: inset 0 0 0 1px rgba(38,37,30,0.2); color: #26251e; font: inherit; font-size: 14px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18 6a8 8 0 0 1 0 12"/></svg>Listen
      </button>
    </div>
    <p style="margin: 0; font-size: 21px; line-height: 1.3; letter-spacing: -0.005em;">Mother kangaroo and her son Max together weigh 60 kg. The mother on her own weighs 52 kg. How heavy is Max?</p>
    <figure style="margin: 0; background: #ffffff; border-radius: 4px; padding: 8px; box-shadow: inset 0 0 0 1px rgba(38,37,30,0.1);">
      <img src="../assets/kangaroos.svg" alt="Two kangaroos" style="display: block; width: 100%; height: 120px; object-fit: contain;">
    </figure>
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <sc-for list="{{choices}}" as="o" hint-placeholder-count="5">
        <div style="{{o.card}}">
          <span style="{{o.badge}}">{{o.mark}}</span>
          <span style="flex: 1; font-size: 20px;">{{o.text}}</span>
          <span style="font-size: 13px;">{{o.tag}}</span>
        </div>
      </sc-for>
    </div>
  </main>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; background: #f7f7f4; box-shadow: inset 0 1px 0 rgba(38,37,30,0.1); padding: 12px 16px 20px; display: flex; flex-direction: column; gap: 10px;">
    <p aria-live="polite" style="margin: 0; font-size: 17px;"><span style="color: #1f8a65;">✓</span> Right. Max weighs 8 kg.</p>
    <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 8px;">
      <button type="button" aria-label="Previous question" style="min-height: 52px; border: none; border-radius: 9999px; background: transparent; box-shadow: inset 0 0 0 1px rgba(38,37,30,0.2); color: #26251e; font: inherit; font-size: 16px;">←</button>
      <button type="button" style="min-height: 52px; border: none; border-radius: 9999px; background: #26251e; color: #f7f7f4; font: inherit; font-size: 16px;">Next question →</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const base = 'width: 40px; height: 44px; flex: none; border: none; border-radius: 4px; font-family: "JetBrains Mono", monospace; font-size: 14px; box-sizing: border-box;';
    const chips = [];
    for (let n = 73; n <= 80; n++) {
      let s;
      if (n > 78) s = 'background: transparent; color: rgba(38,37,30,0.6); box-shadow: inset 0 0 0 1px rgba(38,37,30,0.2);';
      else if (n === 74) s = 'background: #f8d6d5; color: #a8213f; box-shadow: inset 0 0 0 1px #cf2d56;';
      else s = 'background: #1f8a65; color: #ffffff;';
      if (n === 78) s += ' box-shadow: 0 0 0 2px #f2f1ed, 0 0 0 4px #f54e00;';
      chips.push({ n, aria: 'Question ' + n, style: base + s });
    }
    const opts = [['A', '4 kg'], ['B', '8 kg'], ['C', '30 kg'], ['D', '56 kg'], ['E', '112 kg']];
    const choices = opts.map(([l, t]) => {
      let card = 'display: flex; align-items: center; gap: 12px; min-height: 54px; padding: 6px 14px 6px 8px; border-radius: 4px; box-sizing: border-box; ';
      let badge = 'width: 40px; height: 40px; flex: none; border-radius: 9999px; display: flex; align-items: center; justify-content: center; font-size: 16px; box-sizing: border-box; ';
      let mark = l, tag = '';
      if (l === 'B') { card += 'background: #e3f1ea; box-shadow: inset 0 0 0 2px #1f8a65;'; badge += 'background: #1f8a65; color: #ffffff;'; mark = '✓'; tag = 'B · your answer'; }
      else { card += 'background: #f2f1ed; box-shadow: inset 0 0 0 1px rgba(38,37,30,0.1); opacity: 0.5;'; badge += 'box-shadow: inset 0 0 0 1px rgba(38,37,30,0.6);'; }
      return { text: t, card, badge, mark, tag };
    });
    return { chips, choices };
  }
}
</script>
</body>
</html>
