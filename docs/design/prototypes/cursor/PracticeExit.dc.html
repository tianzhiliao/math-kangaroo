<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>End practice dialog</title>
<script src="../support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400&amp;family=JetBrains+Mono:wght@400&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1280px; height: 900px; position: relative; overflow: hidden; background: #f7f7f4; color: #26251e; font-family: 'Inter', system-ui, sans-serif; font-weight: 400;">
  <dc-import name="Practice" hint-size="1280px,1180px"></dc-import>
  <div style="position: absolute; inset: 0; background: rgba(20,18,11,0.4); display: flex; align-items: center; justify-content: center; padding: 24px;">
    <div role="dialog" aria-modal="true" aria-labelledby="exit-b" style="width: 100%; max-width: 500px; box-sizing: border-box; background: #f7f7f4; border-radius: 4px; padding: 26px 28px 24px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 0 0 1px rgba(38,37,30,0.05), 0 0 1rem rgba(0,0,0,0.02), 0 0 0.5rem rgba(0,0,0,0.008);">
      <h2 id="exit-b" style="margin: 0; font-size: 22px; line-height: 1.3; font-weight: 400; letter-spacing: -0.005em;">Keep your progress?</h2>
      <p style="margin: 0; font-size: 16px; line-height: 1.5; color: rgba(38,37,30,0.6);">You are on <span style="font-family: 'JetBrains Mono', monospace; color: #26251e;">Q78 / 270</span>. Keep it to continue from here next time, or clear it to start again at Q1.</p>
      <div style="display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; margin-top: 14px;">
        <button type="button" style="min-height: 48px; padding: 0 18px; border: none; border-radius: 9999px; background: transparent; color: rgba(38,37,30,0.6); font: inherit; font-size: 15px;">Cancel</button>
        <button type="button" style="min-height: 48px; padding: 0 20px; border: none; border-radius: 9999px; background: transparent; box-shadow: inset 0 0 0 1px #cf2d56; color: #a8213f; font: inherit; font-size: 15px;">Clear and exit</button>
        <button type="button" style="min-height: 48px; padding: 0 20px; border: none; border-radius: 9999px; background: #26251e; color: #f7f7f4; font: inherit; font-size: 15px;">Keep and exit</button>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
