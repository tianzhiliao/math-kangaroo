<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Practice on phone</title>
<script src="../support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #ffffff; color: #000000; font-family: 'Inter', system-ui, sans-serif;">
  <header style="height: 54px; padding: 0 8px 0 4px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(0,0,0,0.12);">
    <a href="Home.dc.html" aria-label="Home" style="width: 44px; height: 44px; border-radius: 9999px; display: flex; align-items: center; justify-content: center; color: rgba(0,0,0,0.6); text-decoration: none;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
    </a>
    <span style="font-size: 16px; font-weight: 500;">Question 78 of 270</span>
    <a href="PracticeExit.dc.html" style="height: 40px; padding: 0 14px; display: flex; align-items: center; border-radius: 2.5rem; background: #f1f1f1; color: #000000; font-size: 14px; font-weight: 500; text-decoration: none;">End</a>
  </header>

  <div style="padding: 12px 16px; display: flex; gap: 8px; overflow: hidden; border-bottom: 1px solid rgba(0,0,0,0.12);">
    <sc-for list="{{chips}}" as="c" hint-placeholder-count="8">
      <button type="button" aria-label="{{c.aria}}" style="{{c.style}}">{{c.n}}</button>
    </sc-for>
  </div>

  <main style="padding: 20px 16px 150px; display: flex; flex-direction: column; gap: 14px;">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px;">
      <p style="margin: 0; font-size: 13px; font-weight: 500; color: rgba(0,0,0,0.6);">Felix · Austria 2019 · Q3 · 3 points</p>
      <button type="button" aria-label="Listen to question" style="width: 44px; height: 44px; flex: none; border: none; border-radius: 9999px; background: #f1f1f1; color: #000000; display: flex; align-items: center; justify-content: center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18 6a8 8 0 0 1 0 12"/></svg>
      </button>
    </div>
    <p style="margin: 0; font-size: 21px; line-height: 28px; font-weight: 500; letter-spacing: -0.01em;">Mother kangaroo and her son Max together weigh 60 kg. The mother on her own weighs 52 kg. How heavy is Max?</p>
    <figure style="margin: 0; border: 1px solid rgba(0,0,0,0.12); border-radius: 16px; padding: 8px;">
      <img src="../assets/kangaroos.svg" alt="Two kangaroos" style="display: block; width: 100%; height: 116px; object-fit: contain;">
    </figure>
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <sc-for list="{{choices}}" as="o" hint-placeholder-count="5">
        <div style="{{o.card}}">
          <span style="{{o.badge}}">{{o.label}}</span>
          <span style="flex: 1; font-size: 19px; font-weight: 500;">{{o.text}}</span>
          <span style="font-size: 13px; font-weight: 500; color: #027f41;">{{o.tag}}</span>
        </div>
      </sc-for>
    </div>
  </main>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; background: #ffffff; border-top: 1px solid rgba(0,0,0,0.12); padding: 12px 16px 20px; display: flex; flex-direction: column; gap: 10px;">
    <p aria-live="polite" style="margin: 0; align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px; border-radius: 9999px; background: #def3e5; color: #2c6732; font-size: 16px; font-weight: 500;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Right—Max weighs 8 kg
    </p>
    <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 8px;">
      <button type="button" style="height: 48px; border: none; border-radius: 2.5rem; background: #f1f1f1; color: #000000; font: inherit; font-size: 15px; font-weight: 500;">Previous</button>
      <button type="button" style="height: 48px; border: none; border-radius: 2.5rem; background: #000000; color: #ffffff; font: inherit; font-size: 15px; font-weight: 500;">Next question</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const base = 'width: 40px; height: 40px; flex: none; border-radius: 9999px; font-family: Inter, sans-serif; font-size: 14px; font-weight: 500; box-sizing: border-box;';
    const chips = [];
    for (let n = 73; n <= 80; n++) {
      let s;
      if (n > 78) s = 'background: #ffffff; color: rgba(0,0,0,0.6); border: 1px solid rgba(0,0,0,0.12);';
      else if (n === 74) s = 'background: #ffe5e0; color: #92201d; border: none;';
      else s = 'background: #def3e5; color: #2c6732; border: none;';
      if (n === 78) s += ' outline: 2px solid #000000; outline-offset: 2px;';
      chips.push({ n, aria: 'Question ' + n, style: base + s });
    }
    const opts = [['A', '4 kg'], ['B', '8 kg'], ['C', '30 kg'], ['D', '56 kg'], ['E', '112 kg']];
    const choices = opts.map(([l, t]) => {
      let card = 'display: flex; align-items: center; gap: 12px; min-height: 54px; padding: 6px 16px 6px 8px; border-radius: 16px; box-sizing: border-box; ';
      let badge = 'width: 40px; height: 40px; flex: none; border-radius: 9999px; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 500; ';
      let tag = '';
      if (l === 'B') { card += 'background: #e6ffec; border: 2px solid #027f41;'; badge += 'background: #027f41; color: #ffffff;'; tag = 'Your answer'; }
      else { card += 'background: #ffffff; border: 2px solid rgba(0,0,0,0.12); opacity: 0.5;'; badge += 'background: #f1f1f1;'; }
      return { label: l, text: t, card, badge, tag };
    });
    return { chips, choices };
  }
}
</script>
</body>
</html>
