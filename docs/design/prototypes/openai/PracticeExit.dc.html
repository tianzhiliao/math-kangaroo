<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>End practice dialog</title>
<script src="../support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1280px; height: 900px; position: relative; overflow: hidden; background: #ffffff; color: #000000; font-family: 'Inter', system-ui, sans-serif;">
  <dc-import name="Practice" hint-size="1280px,1180px"></dc-import>
  <div style="position: absolute; inset: 0; background: rgba(0,0,0,0.44); display: flex; align-items: center; justify-content: center; padding: 24px;">
    <div role="dialog" aria-modal="true" aria-labelledby="exit-c" style="width: 100%; max-width: 480px; box-sizing: border-box; background: #ffffff; border: 1px solid rgba(0,0,0,0.12); border-radius: 24px; padding: 28px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 18px 60px rgba(0,0,0,0.08);">
      <h2 id="exit-c" style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 500; letter-spacing: -0.01em;">Save your practice progress?</h2>
      <p style="margin: 0; font-size: 17px; line-height: 28px; letter-spacing: -0.01em; color: rgba(0,0,0,0.8);">You are on question 78. Keep your progress to continue next time, or clear it to start fresh from question 1.</p>
      <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 12px;">
        <button type="button" style="height: 48px; border: none; border-radius: 2.5rem; background: #000000; color: #ffffff; font: inherit; font-size: 15px; font-weight: 500;">Keep and exit</button>
        <button type="button" style="height: 48px; border: none; border-radius: 2.5rem; background: #ffe5e0; color: #92201d; font: inherit; font-size: 15px; font-weight: 500;">Clear and exit</button>
        <button type="button" style="height: 48px; border: none; border-radius: 2.5rem; background: transparent; color: rgba(0,0,0,0.6); font: inherit; font-size: 15px; font-weight: 500;">Cancel</button>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
