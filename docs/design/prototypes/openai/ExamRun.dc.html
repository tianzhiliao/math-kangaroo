<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Exam in progress</title>
<script src="../support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="min-height: 900px; background: #ffffff; color: #000000; font-family: 'Inter', system-ui, sans-serif; display: flex; flex-direction: column;">
  <header style="min-height: 64px; padding: 8px 24px; box-sizing: border-box; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; border-bottom: 1px solid rgba(0,0,0,0.12);">
    <div style="display: flex; align-items: center; gap: 12px;">
      <a href="ExamPicker.dc.html" aria-label="Leave exam" style="width: 40px; height: 40px; border-radius: 9999px; display: flex; align-items: center; justify-content: center; color: rgba(0,0,0,0.6); text-decoration: none;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
      </a>
      <div style="display: flex; flex-direction: column;">
        <span style="font-size: 14px; font-weight: 500; color: rgba(0,0,0,0.6);">Exam · Level P · Brazil</span>
        <span style="font-size: 18px; line-height: 24px; font-weight: 500; letter-spacing: -0.01em;">2020 paper</span>
      </div>
    </div>
    <div style="display: flex; align-items: center; gap: 16px;">
      <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 6px;" aria-live="polite">
        <span style="font-size: 14px; font-weight: 500; font-variant-numeric: tabular-nums;">31:24 left</span>
        <div role="progressbar" aria-label="Exam time remaining" aria-valuemin="0" aria-valuemax="100" aria-valuenow="70" style="width: 140px; height: 4px; border-radius: 9999px; background: rgba(0,0,0,0.04);"><div style="width: 70%; height: 4px; border-radius: 9999px; background: #000000;"></div></div>
      </div>
      <button type="button" style="height: 44px; padding: 0 20px; border: none; border-radius: 2.5rem; background: #000000; color: #ffffff; font: inherit; font-size: 14px; font-weight: 500;">Submit exam</button>
    </div>
  </header>

  <div style="flex: 1; display: flex; flex-wrap: wrap;">
    <aside style="flex: 1 1 250px; max-width: 100%; box-sizing: border-box; padding: 24px; border-right: 1px solid rgba(0,0,0,0.12); display: flex; flex-direction: column; gap: 16px;">
      <div style="display: flex; justify-content: space-between; align-items: baseline;">
        <h2 style="margin: 0; font-size: 14px; font-weight: 500; color: rgba(0,0,0,0.6);">Questions</h2>
        <span style="font-size: 14px; font-weight: 500;">5 / 24</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; justify-items: center;">
        <sc-for list="{{chips}}" as="c" hint-placeholder-count="24">
          <button type="button" aria-label="{{c.aria}}" style="{{c.style}}">{{c.n}}</button>
        </sc-for>
      </div>
      <div style="display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; font-weight: 500; color: rgba(0,0,0,0.6);">
        <span style="display: inline-flex; align-items: center; gap: 6px;"><span style="width: 10px; height: 10px; border-radius: 9999px; background: #000000;"></span>Now</span>
        <span style="display: inline-flex; align-items: center; gap: 6px;"><span style="width: 10px; height: 10px; border-radius: 9999px; background: #e0e0e0;"></span>Answered</span>
        <span style="display: inline-flex; align-items: center; gap: 6px;"><span style="width: 8px; height: 8px; border-radius: 9999px; border: 1px solid rgba(0,0,0,0.44);"></span>Not yet</span>
      </div>
    </aside>

    <main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column;">
      <div style="flex: 1; padding: 40px 48px; display: flex; justify-content: center;">
        <article style="width: 100%; max-width: 860px; display: flex; flex-direction: column; gap: 28px;">
          <div style="display: flex; flex-wrap: wrap; gap: 28px; align-items: flex-start;">
            <div style="flex: 1 1 360px; min-width: 0; display: flex; flex-direction: column; gap: 14px;">
              <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px;">
                <p style="margin: 0; font-size: 14px; font-weight: 500; color: rgba(0,0,0,0.6);">Question 2 · 3 points</p>
                <button type="button" aria-label="Listen to question" style="width: 44px; height: 44px; border: none; border-radius: 9999px; background: #f1f1f1; color: #000000; display: flex; align-items: center; justify-content: center;">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18 6a8 8 0 0 1 0 12"/></svg>
                </button>
              </div>
              <p style="margin: 0; font-size: 26px; line-height: 34px; font-weight: 500; letter-spacing: -0.01em; text-wrap: pretty;">Julia has 5 pieces of plastic and has stacked these pieces on a table, as shown beside. What was the second piece she put on the table?</p>
            </div>
            <figure style="margin: 0; flex: 0 0 auto; border: 1px solid rgba(0,0,0,0.12); border-radius: 16px; padding: 12px;">
              <img src="../assets/stack.svg" alt="Five stacked plastic pieces" style="display: block; width: 168px; height: 200px; object-fit: contain;">
            </figure>
          </div>

          <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px;">
            <sc-for list="{{choices}}" as="o" hint-placeholder-count="5">
              <button type="button" aria-pressed="{{o.pressed}}" style="{{o.card}}">
                <span style="{{o.badge}}">{{o.label}}</span>
                <img src="{{o.src}}" alt="{{o.alt}}" style="display: block; width: 100%; height: 104px; object-fit: contain;">
              </button>
            </sc-for>
          </div>
        </article>
      </div>

      <footer style="border-top: 1px solid rgba(0,0,0,0.12); padding: 16px 48px;">
        <div style="max-width: 860px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between;">
          <button type="button" style="height: 48px; min-width: 132px; padding: 0 24px; border: none; border-radius: 2.5rem; background: #f1f1f1; color: #000000; font: inherit; font-size: 15px; font-weight: 500;">Previous</button>
          <span style="font-size: 14px; font-weight: 500; color: rgba(0,0,0,0.6);">2 of 24</span>
          <button type="button" style="height: 48px; min-width: 132px; padding: 0 24px; border: none; border-radius: 2.5rem; background: #000000; color: #ffffff; font: inherit; font-size: 15px; font-weight: 500;">Next</button>
        </div>
      </footer>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const answered = { 1: 1, 3: 1, 4: 1, 5: 1 };
    const base = 'width: 44px; height: 44px; border-radius: 9999px; font-family: Inter, sans-serif; font-size: 15px; font-weight: 500; font-variant-numeric: tabular-nums; box-sizing: border-box;';
    const chips = [];
    for (let n = 1; n <= 24; n++) {
      let s;
      if (n === 2) s = 'background: #000000; color: #ffffff; border: none;';
      else if (answered[n]) s = 'background: #e0e0e0; color: #000000; border: none;';
      else s = 'background: #ffffff; color: rgba(0,0,0,0.6); border: 1px solid rgba(0,0,0,0.12);';
      chips.push({ n, aria: 'Question ' + n, style: base + s });
    }
    const imgs = {
      A: '../assets/choice-a.svg', B: '../assets/choice-b.svg',
      C: '../assets/choice-c.svg', D: '../assets/choice-d.svg',
      E: '../assets/choice-e.svg'
    };
    const choices = ['A', 'B', 'C', 'D', 'E'].map((l) => {
      const sel = l === 'B';
      return {
        label: l, src: imgs[l], alt: 'Option ' + l, pressed: sel ? 'true' : 'false',
        card: 'display: flex; flex-direction: column; align-items: flex-start; gap: 8px; padding: 12px; border-radius: 16px; background: #ffffff; cursor: pointer; text-align: left; font: inherit; ' +
          (sel ? 'border: 2px solid #000000;' : 'border: 2px solid rgba(0,0,0,0.12);'),
        badge: 'width: 40px; height: 40px; border-radius: 9999px; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 500; ' +
          (sel ? 'background: #000000; color: #ffffff;' : 'background: #f1f1f1; color: #000000;')
      };
    });
    return { chips, choices };
  }
}
</script>
</body>
</html>
